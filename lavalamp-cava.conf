# cava config for Lava Lamp music reactivity. The plugin spawns
#   cava -p <this file>
# and parses one line of space-separated bar values per frame from stdout.
# raw + ascii is the only streaming mode that works without a terminal:
# noncurses measures the window via ioctl and refuses to start when stdout
# is a pipe.
[general]
bars = 8
framerate = 30
autosens = 0

[input]
method = pipewire

[smoothing]
noise_reduction = 50
monstercat = 1.5
gravity = 0

[output]
method = raw
data_format = ascii
ascii_max_range = 100
bar_delimiter = 32
frame_delimiter = 10